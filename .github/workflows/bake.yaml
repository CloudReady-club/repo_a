name: Build and Vendor Go Modules

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo A
        uses: actions/checkout@v3

      - name: Set Up Git Credentials for Private Modules
        run: |
          git config --global url."https://${{ secrets.TOKEN }}@github.com/".insteadOf "https://github.com/"


      - name: Set Up Go Environment
        run: |
          go env -w GOPRIVATE="github.com/CloudReady-club/*"

      - name: Install Dependencies and Vendor
        run: |
          go mod tidy
          go mod vendor

      - name: Build Project
        run: |
          go build -o app .
